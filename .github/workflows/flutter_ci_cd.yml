name: Flutter CI/CD Pipeline

on:
  # 1. CI: Se activa únicamente cuando se abre o actualiza un Pull Request hacia main o master
  pull_request:
    branches: [ main, master ]

  # 2. CD: Se activa únicamente cuando se hace push o merge definitivo en main o master
  push:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ====================================================================
  # ETAPA 1: CI (Control de Calidad Rápido) - SOLO EN PULL REQUEST
  # Evalúa que el código esté sano antes de permitir el merge.
  # ====================================================================
  quality_checks:
    name: Análisis Estático y Pruebas Automatizadas
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Clonar Repositorio
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Entorno Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:-:hash:'

      - name: 📦 Instalar Dependencias
        run: flutter pub get

      - name: 📐 Verificar Formato de Código (Dart Format)
        run: dart format --output=none --set-exit-if-changed lib test

      - name: 🔍 Análisis Estático (Flutter Analyze)
        run: flutter analyze --no-fatal-infos

      - name: 🧪 Ejecutar Suite de Pruebas Automatizadas con Cobertura
        run: flutter test --coverage

      - name: 📊 Cargar Reporte de Cobertura de Pruebas
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-coverage-report
          path: coverage/lcov.info
          retention-days: 7

  # ====================================================================
  # ETAPA 2: CD (Compilación Web Wasm) - SOLO AL HACER MERGE EN MAIN
  # Cero doble esfuerzo: main NO vuelve a correr las pruebas que ya aprobó el PR.
  # ====================================================================
  build_web:
    name: Compilación WebAssembly (Flutter Web)
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Clonar Repositorio
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Entorno Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Instalar Dependencias
        run: flutter pub get

      - name: 🚀 Compilar Flutter Web con Wasm y Optimización O4
        run: flutter build web --wasm --release -O4 --no-source-maps

      - name: 📦 Cargar Artefacto Web Compilado
        uses: actions/upload-artifact@v4
        with:
          name: flutter-web-bundle
          path: build/web
          retention-days: 14

  # ====================================================================
  # ETAPA 3: CD (Compilación APK Android) - SOLO AL HACER MERGE EN MAIN
  # Cero doble esfuerzo: genera el instalador oficial final para el usuario.
  # ====================================================================
  build_android:
    name: Compilación APK Android (Release)
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Clonar Repositorio
        uses: actions/checkout@v4

      - name: ☕ Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: ⚙️ Configurar Entorno Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Instalar Dependencias
        run: flutter pub get

      - name: 📱 Compilar APK de Producción (Split per ABI)
        run: flutter build apk --release --split-per-abi --android-skip-build-dependency-validation

      - name: 📦 Cargar APKs Compiladas
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apks
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 14
